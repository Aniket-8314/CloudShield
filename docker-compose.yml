services:

  cloudshield:
    build: .
    container_name: cloudshield-api

    ports:
      - "8000:8000"

    depends_on:
      - redis
      - postgres
      - backend

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      BACKEND_URL: http://backend:9000


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: cloudshield-backend

    ports:
      - "9000:9000"


  redis:
    image: redis:7

    container_name: cloudshield-redis

    ports:
      - "6379:6379"


  postgres:
    image: postgres:16

    container_name: cloudshield-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: